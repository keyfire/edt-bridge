<svg xmlns="http://www.w3.org/2000/svg" width="840" height="492" viewBox="0 0 840 492">
  <style>
    /* The colours live in variables so the picture follows the reader's theme: the light
       palette is the default, the dark one comes from the media query. It works even when the
       file is embedded as an image: the SVG document gets the system preference of its own. The PNG next to
       it is rendered from this file with a palette forced (scripts/render-diagrams.py),
       because a README on GitHub does not follow the reader's theme. */
    :root {
      --card: #ffffff; --card-edge: #d0d7e2; --divider: #d7dde8;
      --box: #ffffff; --box-edge: #ccd4e0;
      --title: #1c2029; --muted: #5c6577; --body: #414a5c;
      --edge-text: #3c4557; --edge: #8a94a6; --edge-sub: #67707f;
      --accent-blue: #0969da; --accent-teal: #0b7285; --accent-green: #1a7f37;
      --accent-yellow: #9a6700; --accent-orange: #bc4c00; --accent-purple: #8250df;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --card: #14171e; --card-edge: #262c38; --divider: #2c3345;
        --box: #232a38; --box-edge: #3b445c;
        --title: #eef1f8; --muted: #7f8aa3; --body: #aab3c7;
        --edge-text: #c6cddd; --edge: #6d7891; --edge-sub: #8b95ab;
        --accent-blue: #3794ff; --accent-teal: #39c5cf; --accent-green: #56d364;
        --accent-yellow: #ffd23f; --accent-orange: #f0883e; --accent-purple: #a78bfa;
      }
    }
    text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: Consolas, 'Cascadia Mono', Menlo, monospace; font-size: 10.2px; }
    .title { font-size: 17px; font-weight: 600; fill: var(--title); }
    .box-title { font-size: 14.5px; font-weight: 600; fill: var(--title); }
    .box-body { font-size: 11.5px; fill: var(--body); }
    .edge-sub { font-size: 11.5px; font-style: italic; fill: var(--edge-sub); }
    .note { font-size: 12px; fill: var(--edge-sub); }
    .box { fill: var(--box); stroke: var(--box-edge); }
    .edge { stroke: var(--edge); stroke-width: 1.5; fill: none; }
    .mono-body { font-family: Consolas, 'Cascadia Mono', Menlo, monospace; font-size: 10.2px; fill: var(--body); }
    .dot-blue { fill: var(--accent-blue); }
    .dot-teal { fill: var(--accent-teal); }
    .dot-green { fill: var(--accent-green); }
    .dot-yellow { fill: var(--accent-yellow); }
    .dot-orange { fill: var(--accent-orange); }
    .dot-purple { fill: var(--accent-purple); }
    .card { fill: var(--card); stroke: var(--card-edge); }
    .divider { stroke: var(--divider); }
    .arrow { fill: var(--edge); }
  </style>
  <defs>
    <marker id="ah2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" class="arrow"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="839" height="491" rx="12" class="card"/>
  <text x="420" y="36" text-anchor="middle" class="title">Full delivery cycle over MCP</text>

  <!-- 1 create -->
  <rect x="26" y="72" width="176" height="120" rx="10" class="box"/>
  <circle cx="44" cy="98" r="4" class="dot-blue"/>
  <text x="56" y="103" class="box-title">1. Create</text>
  <text x="40" y="127" class="mono-body">edt_create_extension</text>
  <text x="40" y="145" class="mono-body">edt_create_external_object</text>
  <text x="40" y="163" class="mono-body">edt_create_object</text>

  <!-- 2 develop -->
  <rect x="224" y="72" width="176" height="120" rx="10" class="box"/>
  <circle cx="242" cy="98" r="4" class="dot-green"/>
  <text x="254" y="103" class="box-title">2. Develop</text>
  <text x="238" y="127" class="mono-body">edt_add_attribute</text>
  <text x="238" y="145" class="mono-body">edt_add_method</text>
  <text x="238" y="163" class="mono-body">edt_module_text</text>
  <text x="238" y="181" class="mono-body">edt_project_errors</text>

  <!-- 3 build -->
  <rect x="422" y="72" width="176" height="120" rx="10" class="box"/>
  <circle cx="440" cy="98" r="4" class="dot-yellow"/>
  <text x="452" y="103" class="box-title">3. Build</text>
  <text x="436" y="127" class="mono-body">edt_dump_external_object</text>
  <text x="436" y="147" class="box-body">.epf / .erf on disk</text>
  <text x="436" y="165" class="box-body">(needs a local</text>
  <text x="436" y="182" class="box-body">1C platform)</text>

  <!-- 4 deliver -->
  <rect x="620" y="72" width="194" height="120" rx="10" class="box"/>
  <circle cx="638" cy="98" r="4" class="dot-orange"/>
  <text x="650" y="103" class="box-title">4. Deliver</text>
  <text x="634" y="127" class="mono-body">edt_update_infobase</text>
  <text x="634" y="145" class="mono-body">edt_update_database_config</text>
  <text x="634" y="163" class="mono-body">edt_extension_properties</text>
  <text x="634" y="182" class="box-body">two steps, not one</text>

  <line x1="202" y1="132" x2="220" y2="132" class="edge" marker-end="url(#ah2)"/>
  <line x1="400" y1="132" x2="418" y2="132" class="edge" marker-end="url(#ah2)"/>
  <line x1="598" y1="132" x2="616" y2="132" class="edge" marker-end="url(#ah2)"/>

  <!-- target infobase (running) -->
  <rect x="572" y="252" width="242" height="80" rx="10" class="box"/>
  <circle cx="590" cy="278" r="4" class="dot-teal"/>
  <text x="602" y="283" class="box-title">running infobase</text>
  <text x="586" y="306" class="box-body">test stand:</text>
  <text x="586" y="323" class="box-body">configuration + extensions</text>
  <line x1="722" y1="192" x2="710" y2="248" class="edge" marker-end="url(#ah2)"/>
  <text x="700" y="214" text-anchor="end" class="edge-sub">through the configurator agent</text>
  <text x="700" y="229" text-anchor="end" class="edge-sub">as the infobase user</text>

  <!-- 5 debug -->
  <rect x="26" y="252" width="300" height="80" rx="10" class="box"/>
  <circle cx="44" cy="278" r="4" class="dot-purple"/>
  <text x="56" y="283" class="box-title">5. Debug</text>
  <text x="40" y="306" class="mono-body">edt_debug_attach / inspect / control</text>
  <text x="40" y="323" class="mono-body">edt_evaluate</text>

  <!-- running infobase -> debug (attach) -->
  <line x1="572" y1="300" x2="330" y2="300" class="edge" marker-end="url(#ah2)"/>
  <text x="451" y="290" text-anchor="middle" class="edge-sub">attach to the running infobase (dbgs)</text>

  <!-- debug -> create (iterate) -->
  <line x1="92" y1="252" x2="92" y2="196" class="edge" stroke-dasharray="6 4" marker-end="url(#ah2)"/>
  <text x="102" y="228" class="edge-sub">iterate: fix, rebuild, redeploy</text>

  <text x="26" y="418" class="note">Extension projects go straight from the workspace into the infobase (step 4); external data processors are compiled to .epf first (step 3).</text>
  <text x="26" y="440" class="note">Delivery is two steps: load the configuration into the infobase, then apply the DATABASE configuration.</text>
  <text x="26" y="462" class="note">Until that second step, every session keeps running the previous code - which is what a freshly added route answering 404 looks like.</text>
</svg>
